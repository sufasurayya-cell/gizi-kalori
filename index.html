<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutriTrack AI – Data Pribadi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥗%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style id="st">
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:#f1f5f9;color:#1e293b}
@media print{.no-print{display:none!important}body{background:#fff!important}}

body.ro .own{display:none!important}
@media(min-width:1024px){body.ro .rc,body.ro .pc{grid-column:1/-1}}
</style>
</head>
<body class="font-sans min-h-screen ro">
<template id="tpl"><div id="app">
 <header class="bg-emerald-600 text-white no-print shadow-md">
  <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
   <div><h1 class="text-xl font-bold">📈 NutriTrack AI</h1><p class="text-xs text-emerald-100">Data pribadi saya</p></div>
   <div class="flex items-center gap-3">
    <span id="status" class="text-xs text-emerald-100"></span>
    <button onclick="window.print()" class="bg-amber-500 hover:bg-amber-600 px-3 py-1.5 rounded-lg text-sm font-semibold">🖨️ Cetak</button>
   </div>
  </div>
 </header>

 <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
  <section class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
   <h2 class="text-lg font-bold mb-4">🧍 Profil Data Diri &amp; Analisis IMT</h2>
   <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <form id="f-prof" class="space-y-3 no-print own">
     <div class="grid grid-cols-2 gap-3">
      <div><label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Kelamin</label><select id="p-gender" class="w-full px-3 py-1.5 border rounded-lg text-sm"><option value="male">Laki-laki</option><option value="female">Perempuan</option></select></div>
      <div><label class="block text-xs font-semibold text-slate-600 mb-1">Umur</label><input type="number" id="p-age" min="1" max="120" required="" class="w-full px-3 py-1.5 border rounded-lg text-sm"></div>
      <div><label class="block text-xs font-semibold text-slate-600 mb-1">Tinggi (cm)</label><input type="number" id="p-h" min="50" max="250" required="" class="w-full px-3 py-1.5 border rounded-lg text-sm"></div>
      <div><label class="block text-xs font-semibold text-slate-600 mb-1">Berat (kg)</label><input type="number" id="p-w" min="20" max="300" required="" class="w-full px-3 py-1.5 border rounded-lg text-sm"></div>
     </div>
     <div><label class="block text-xs font-semibold text-slate-600 mb-1">Aktivitas Harian</label><select id="p-act" class="w-full px-3 py-1.5 border rounded-lg text-sm"><option value="1.375">Ringan (jarang olahraga)</option><option value="1.55">Sedang (olahraga 3–5 hari/minggu)</option><option value="1.725">Berat (olahraga berat / pekerja fisik)</option></select></div>
     <button id="b-prof" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg text-xs">Coba Hitung IMT</button>
     <div id="try-res" class="hidden text-xs bg-indigo-50 border border-indigo-200 text-indigo-900 rounded-lg p-3"></div>
    </form>
    <div class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4 pc">
     <div class="bg-slate-50 p-5 rounded-xl border border-slate-200">
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Indeks Massa Tubuh</span>
      <div class="flex items-baseline gap-3 mt-2 flex-wrap"><span id="bmi" class="text-4xl font-extrabold">0.0</span><span id="bmi-s" class="px-3 py-1 rounded-full text-xs font-bold bg-slate-200">-</span></div>
      <p id="bmi-d" class="mt-4 text-xs text-slate-600 border-t pt-3"></p>
     </div>
     <div class="bg-emerald-50 p-5 rounded-xl border border-emerald-200">
      <span class="text-xs font-semibold text-emerald-700 uppercase tracking-wider">Kebutuhan Kalori Harian (TDEE)</span>
      <div class="flex items-baseline gap-2 mt-2"><span id="tdee" class="text-4xl font-extrabold text-emerald-700">0</span><span class="text-sm font-semibold text-emerald-600">kcal/hari</span></div>
      <div class="mt-4 text-xs text-emerald-800 border-t pt-3 border-emerald-200"><p>BMR: <b id="bmr">0 kcal</b></p><p>Aktivitas: <b id="act-t">-</b></p></div>
     </div>
    </div>
   </div>
  </section>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
   <section class="bg-white p-6 rounded-2xl shadow-md border border-slate-200 no-print space-y-4 self-start own">
    <h2 class="text-lg font-bold">📷 Input &amp; Deteksi Makanan</h2>
    <form id="f-food" class="space-y-4">
     <div><label class="block text-xs font-semibold text-slate-600 mb-1">Upload Foto Makanan</label><input type="file" id="f-img" accept="image/*" class="w-full text-sm text-slate-500"></div>
     <div id="prev-box" class="hidden">
      <img id="prev" alt="Preview" class="w-full h-40 object-cover rounded-lg border">
      <button type="button" id="btn-ai" class="mt-2 w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2 rounded-lg">✨ Deteksi Foto dengan Claude</button>
      <p id="ai-msg" class="mt-1 text-[11px] text-slate-500"></p>
     </div>
     <div><label class="block text-xs font-semibold text-slate-600 mb-1">Nama Makanan</label><input id="n" required="" placeholder="Contoh: Nasi Goreng Telur" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
     <div class="grid grid-cols-2 gap-3">
      <div><label class="block text-xs font-semibold text-slate-600 mb-1">Waktu Makan</label><select id="cat" class="w-full px-3 py-2 border rounded-lg text-sm"><option>Sarapan</option><option>Makan Siang</option><option>Makan Malam</option><option>Camilan</option></select></div>
      <div><label class="block text-xs font-semibold text-slate-600 mb-1">Jam</label><input type="time" id="tm" required="" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
      <div><label class="block text-xs font-semibold text-slate-600 mb-1">Kalori (kcal)</label><input type="number" id="cal" required="" min="0" placeholder="350" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
      <div><label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label><input type="date" id="dt" required="" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
     </div>
     <div class="grid grid-cols-3 gap-2">
      <div><label class="block text-[10px] font-semibold text-slate-500">Karbo (g)</label><input type="number" id="carb" value="0" min="0" class="w-full px-2 py-1 border rounded text-xs"></div>
      <div><label class="block text-[10px] font-semibold text-slate-500">Protein (g)</label><input type="number" id="prot" value="0" min="0" class="w-full px-2 py-1 border rounded text-xs"></div>
      <div><label class="block text-[10px] font-semibold text-slate-500">Lemak (g)</label><input type="number" id="fat" value="0" min="0" class="w-full px-2 py-1 border rounded text-xs"></div>
     </div>
     <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm">＋ Simpan Catatan</button>
    </form>
   </section>

   <div class="lg:col-span-2 space-y-6 rc">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
     <div class="bg-white p-4 rounded-xl shadow border border-slate-200"><p class="text-xs text-slate-500 font-semibold">Total Kalori</p><p class="text-2xl font-extrabold text-emerald-600"><span id="s-cal">0</span> <small class="text-xs text-slate-400">kcal</small></p></div>
     <div class="bg-white p-4 rounded-xl shadow border border-slate-200"><p class="text-xs text-slate-500 font-semibold">Karbohidrat</p><p class="text-2xl font-extrabold text-amber-500"><span id="s-carb">0</span> <small class="text-xs text-slate-400">g</small></p></div>
     <div class="bg-white p-4 rounded-xl shadow border border-slate-200"><p class="text-xs text-slate-500 font-semibold">Protein</p><p class="text-2xl font-extrabold text-indigo-500"><span id="s-prot">0</span> <small class="text-xs text-slate-400">g</small></p></div>
     <div class="bg-white p-4 rounded-xl shadow border border-slate-200"><p class="text-xs text-slate-500 font-semibold">Lemak</p><p class="text-2xl font-extrabold text-rose-500"><span id="s-fat">0</span> <small class="text-xs text-slate-400">g</small></p></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
     <div class="bg-white p-4 rounded-xl shadow border border-slate-200"><h3 class="text-sm font-bold mb-2">Kalori per Waktu Makan</h3><div class="h-48"><canvas id="c-pie"></canvas></div></div>
     <div class="bg-white p-4 rounded-xl shadow border border-slate-200"><h3 class="text-sm font-bold mb-2">Total Kalori per Hari</h3><div class="h-48"><canvas id="c-bar"></canvas></div></div>
    </div>
    <div class="bg-white p-4 rounded-xl shadow border border-slate-200"><h3 class="text-sm font-bold mb-2">Tren Asupan Kalori</h3><div class="h-48"><canvas id="c-line"></canvas></div></div>
   </div>
  </div>

  <section class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
   <div class="flex justify-between items-center mb-4"><h2 class="text-lg font-bold">📋 Riwayat Konsumsi</h2><span id="cnt" class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full">0 catatan</span></div>
   <div class="overflow-x-auto" style="max-width:100%">
    <table class="w-full text-left border-collapse min-w-[640px]">
     <thead><tr class="border-b bg-slate-50 text-slate-600 text-xs font-semibold"><th class="p-3">Foto</th><th class="p-3">Waktu</th><th class="p-3">Makanan</th><th class="p-3">Kategori</th><th class="p-3 text-right">Kalori</th><th class="p-3 text-right">Gizi (K/P/L)</th><th class="p-3 text-center no-print own">Aksi</th></tr></thead>
     <tbody id="rows" class="divide-y text-sm"></tbody>
    </table>
   </div>
  </section>
 </main>
</div>

</template>

const PLACEHOLDER = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23e2e8f0'/%3E%3Ctext x='50' y='62' font-size='40' text-anchor='middle'%3E🍽️%3C/text%3E%3C/svg%3E";
let foods = [], prof = {gender:'male', age:20, height:165, weight:60, activity:1.375};
let imgThumb = "", imgBlob = null, charts = {}, owner = false;
const FAV = '<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ctext y=\'.9em\' font-size=\'90\'%3E🥗%3C/text%3E%3C/svg%3E">';
const KIND = {telur:['🍳','#fef3c7'], ayam:['🍗','#ffedd5'], bebek:['🍗','#fde68a'], ikan:['🐟','#dbeafe'], sayur:['🥬','#dcfce7'], sup:['🍲','#fee2e2']};
function pic(f){
  if (f.image) return f.image;
  const k = KIND[f.icon]; if (!k) return PLACEHOLDER;
  return "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='"+k[1]+"'/><text x='50' y='66' font-size='48' text-anchor='middle'>"+k[0]+"</text></svg>");
}
function status(t){ $('status').textContent = t; }
function fillProfile(){ $('p-gender').value=prof.gender; $('p-age').value=prof.age; $('p-h').value=prof.height; $('p-w').value=prof.weight; $('p-act').value=String(prof.activity); }

// Seluruh halaman dibangun ulang dari data, lalu dipublikasikan sebagai versi baru
function build(){
  const seed = JSON.stringify({profile:prof, foods}).replace(/</g, '\\u003c');
  return ['<!DOCTYPE html>','<html lang="id">','<head>','<meta charset="UTF-8">',
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">',
    '<title>NutriTrack AI – Data Pribadi</title>', FAV,
    '<script src="https://cdn.tailwindcss.com/3.4.17"><\/script>',
    '<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"><\/script>',
    '<style id="st">'+$('st').textContent+'</style>','</head>','<body class="font-sans min-h-screen ro">',
    '<template id="tpl">'+document.getElementById('tpl').innerHTML+'</template>',
    '<script id="seed" type="application/json">'+seed+'<\/script>',
    '<script id="code">'+document.getElementById('code').textContent+'<\/script>','</body>','</html>'].join('\n');
}
async function save(){
  status('Menyimpan…');
  try {
    const a = await claude.use('artifact');
    if (!a) throw {code:'none'};
    await a.publish(build());
  } catch(e) {
    if (e && e.code === 'conflict') return;
    status(e && (e.code==='not_writer' || e.code==='not_granted') ? '⚠️ Tidak punya izin menyimpan' : '⚠️ Gagal menyimpan, coba lagi');
  }
}

function tryBMI(p){
  const hm = p.height/100, bmi = p.weight/(hm*hm);
  const s = bmi<18.5 ? 'Kurus' : bmi<23 ? 'Normal (Ideal)' : bmi<25 ? 'Kelebihan Berat' : bmi<30 ? 'Obesitas I' : 'Obesitas II';
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.gender==='male'?5:-161);
  const r = $('try-res'); r.classList.remove('hidden');
  r.innerHTML = '<b>IMT kamu: '+bmi.toFixed(1)+'</b> ('+s+')<br>Kebutuhan kalori: <b>'+Math.round(bmr*p.activity)+' kcal/hari</b><br><span class="text-slate-500">Hanya tampil di layarmu, tidak mengubah data pemilik.</span>';
}
$('f-prof').onsubmit = e => {
  e.preventDefault();
  const p = { gender:$('p-gender').value, age:+$('p-age').value, height:+$('p-h').value, weight:+$('p-w').value, activity:+$('p-act').value };
  if (!owner) { tryBMI(p); return; }
  prof = p; renderBMI(); save();
};
function renderBMI(){
  const hm = prof.height/100, bmi = prof.weight/(hm*hm);
  let s, c, d;
  if (bmi < 18.5){ s='Kurus'; c='bg-amber-100 text-amber-700'; d='Kategori kurus. Tingkatkan asupan kalori dan nutrisi harian.'; }
  else if (bmi < 23){ s='Normal (Ideal)'; c='bg-emerald-100 text-emerald-700'; d='Berat badan ideal! Pertahankan pola makan sehat ini.'; }
  else if (bmi < 25){ s='Kelebihan Berat'; c='bg-orange-100 text-orange-700'; d='Kategori overweight. Kontrol porsi makan dan tingkatkan aktivitas.'; }
  else if (bmi < 30){ s='Obesitas I'; c='bg-rose-100 text-rose-700'; d='Kategori obesitas tingkat I (Asia-Pasifik). Atur asupan kalori dan rutin bergerak.'; }
  else { s='Obesitas II'; c='bg-rose-100 text-rose-700'; d='Kategori obesitas tingkat II (Asia-Pasifik). Disarankan konsultasi dengan tenaga kesehatan.'; }
  $('bmi').textContent = bmi.toFixed(1);
  $('bmi-s').textContent = s; $('bmi-s').className = 'px-3 py-1 rounded-full text-xs font-bold '+c;
  $('bmi-d').textContent = d;
  const bmr = 10*prof.weight + 6.25*prof.height - 5*prof.age + (prof.gender==='male'?5:-161);
  $('tdee').textContent = Math.round(bmr*prof.activity);
  $('bmr').textContent = Math.round(bmr)+' kcal';
  $('act-t').textContent = prof.activity===1.55?'Sedang':prof.activity===1.725?'Berat':'Ringan';
}

function resize(img, max, q, cb){
  const r = Math.min(1, max/Math.max(img.width, img.height)), cv = document.createElement('canvas');
  cv.width = Math.round(img.width*r); cv.height = Math.round(img.height*r);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  cb(cv);
}
$('f-img').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    resize(img, 220, .6, cv => { imgThumb = cv.toDataURL('image/jpeg', .6); $('prev').src = imgThumb; $('prev-box').classList.remove('hidden'); });
    resize(img, 640, .75, cv => cv.toBlob(b => { imgBlob = b; }, 'image/jpeg', .75));
    URL.revokeObjectURL(url);
  };
  img.src = url;
};

$('btn-ai').onclick = async () => {
  const note = $('ai-msg'), btn = $('btn-ai');
  if (!imgBlob) { note.textContent = 'Foto belum siap, coba lagi sebentar.'; return; }
  let sample = null;
  try { sample = await claude.use('sample'); } catch(e){}
  if (!sample) { note.textContent = 'Deteksi AI hanya tersedia saat dibuka lewat claude.ai. Isi form secara manual.'; return; }
  btn.disabled = true; note.textContent = 'Claude sedang menganalisis foto…';
  try {
    const r = await sample.json(
      'Analisis foto makanan atau minuman ini dan perkirakan gizinya untuk satu porsi yang terlihat. Jawab HANYA JSON murni dengan format: {"name":"nama makanan dalam Bahasa Indonesia","calories":integer,"carbs":integer,"protein":integer,"fat":integer} (karbo, protein, lemak dalam gram).',
      { images:[imgBlob], modelTier:'quick', cache:false });
    $('n').value = r.name || 'Makanan';
    $('cal').value = Math.round(r.calories)||0; $('carb').value = Math.round(r.carbs)||0;
    $('prot').value = Math.round(r.protein)||0; $('fat').value = Math.round(r.fat)||0;
    note.textContent = '✅ Terdeteksi. Ini perkiraan, silakan koreksi bila perlu.';
  } catch(e) {
    note.textContent = e && e.code==='not_granted' ? 'Izin ditolak. Isi form secara manual.' : e && e.code==='rate_limited' ? 'Terlalu sering, tunggu sebentar.' : 'Deteksi gagal. Isi form secara manual.';
  } finally { btn.disabled = false; }
};

function resetDates(){
  const n = new Date(), p = x => String(x).padStart(2,'0');
  $('dt').value = `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`;
  $('tm').value = `${p(n.getHours())}:${p(n.getMinutes())}`;
}

$('f-food').onsubmit = e => {
  e.preventDefault();
  const entry = { id:Date.now(), image:imgThumb||PLACEHOLDER, name:$('n').value, category:$('cat').value, time:$('tm').value, date:$('dt').value,
    calories:+$('cal').value||0, carbs:+$('carb').value||0, protein:+$('prot').value||0, fat:+$('fat').value||0 };
  foods.unshift(entry); renderAll(); save();
};
function del(id){ if (confirm('Hapus catatan ini?')) { foods = foods.filter(f=>f.id!==id); renderAll(); save(); } }
const badge = c => ({'Sarapan':'bg-amber-100 text-amber-700','Makan Siang':'bg-blue-100 text-blue-700','Makan Malam':'bg-indigo-100 text-indigo-700'}[c] || 'bg-purple-100 text-purple-700');
function renderAll(){
  renderBMI();
  $('cnt').textContent = foods.length+' catatan';
  $('rows').innerHTML = foods.length ? foods.map(f=>`<tr class="hover:bg-slate-50">
   <td class="p-3"><img src="${esc(pic(f))}" alt="" class="w-12 h-12 rounded-lg object-cover border"></td>
   <td class="p-3 text-xs"><b>${esc(f.date)}</b><br><span class="text-slate-400">${esc(f.time)} WIB</span></td>
   <td class="p-3 font-semibold">${esc(f.name)}</td>
   <td class="p-3"><span class="text-xs px-2.5 py-1 rounded-full font-medium ${badge(f.category)}">${esc(f.category)}</span></td>
   <td class="p-3 text-right font-bold text-emerald-600">${f.calories} kcal</td>
   <td class="p-3 text-right text-xs text-slate-500">K ${f.carbs}g | P ${f.protein}g | L ${f.fat}g</td>
   <td class="p-3 text-center no-print own"><button data-del="${f.id}" class="text-rose-500 hover:text-rose-700 p-1">🗑️</button></td></tr>`).join('')
   : '<tr><td colspan="7" class="text-center py-6 text-slate-400">Belum ada catatan makanan.</td></tr>';
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => del(+b.dataset.del));
  const t = foods.reduce((a,f)=>({c:a.c+f.calories, k:a.k+f.carbs, p:a.p+f.protein, l:a.l+f.fat}), {c:0,k:0,p:0,l:0});
  $('s-cal').textContent=t.c; $('s-carb').textContent=t.k; $('s-prot').textContent=t.p; $('s-fat').textContent=t.l;
  drawCharts();
}
function drawCharts(){
  if (typeof Chart === 'undefined') return;
  Object.values(charts).forEach(c=>c.destroy());
  const cats = {'Sarapan':0,'Makan Siang':0,'Makan Malam':0,'Camilan':0};
  foods.forEach(f => { if (f.category in cats) cats[f.category] += f.calories; });
  const dm = {}; foods.forEach(f => dm[f.date] = (dm[f.date]||0) + f.calories);
  const labels = Object.keys(dm).sort().slice(-7), vals = labels.map(d=>dm[d]);
  const opt = { responsive:true, maintainAspectRatio:false };
  charts.pie = new Chart($('c-pie'), { type:'pie', data:{ labels:Object.keys(cats), datasets:[{ data:Object.values(cats), backgroundColor:['#f59e0b','#3b82f6','#6366f1','#a855f7'] }] }, options:opt });
  charts.bar = new Chart($('c-bar'), { type:'bar', data:{ labels:labels.length?labels:['Hari ini'], datasets:[{ label:'Kalori (kcal)', data:vals.length?vals:[0], backgroundColor:'#10b981' }] }, options:opt });
  charts.line = new Chart($('c-line'), { type:'line', data:{ labels:labels.length?labels:['Hari ini'], datasets:[{ label:'Tren Kalori (kcal)', data:vals.length?vals:[0], borderColor:'#059669', backgroundColor:'rgba(5,150,105,.1)', fill:true, tension:.3 }] }, options:opt });
}

async function migrate(){
  // Pindahkan data lama (versi sebelumnya, tersimpan privat di akun) ke halaman ini sekali saja
  try {
    if (foods.length || sessionStorage.getItem('nt_mig')) return;
    sessionStorage.setItem('nt_mig', '1');
    const u = await claude.use('user'), db = await claude.use('db'), uid = u ? await u.id() : null;
    if (!db || !uid) return;
    const snap = await db.collection('data/users/' + uid).get(), list = [];
    snap.docs.forEach(d => { if (!d.exists) return; const x = d.data(); if (d.id === 'profile') prof = {...prof, ...x}; else list.push({...x}); });
    if (!list.length) return;
    foods = list.sort((a,b) => b.id - a.id); fillProfile(); renderAll(); save();
  } catch(e){}
}
async function init(){
  try { const s = JSON.parse($('seed').textContent); prof = {...prof, ...(s.profile||{})}; foods = s.foods || []; } catch(e){}
  $('p-age').value=20; $('p-h').value=165; $('p-w').value=60; renderAll(); status('👁️ Mode lihat');
  try { const u = await claude.use('user'); owner = !!(u && u.isOwner()); } catch(e){}
  if (owner) { document.body.classList.remove('ro'); status('✏️ Mode pemilik'); fillProfile(); $('b-prof').textContent='Hitung & Simpan IMT'; $('try-res').classList.add('hidden'); migrate(); }
}
resetDates(); init();
</script>
</body>
</html>
